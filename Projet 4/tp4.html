<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription d'un Nouveau client</title>
</head>
<body style="background-color: yellow;">

    <h1>Inscription d'un Nouveau client</h1>

    <form action="#" method="post">
        <p><label for="nom">Nom :</label> <input type="text" id="nom" name="nom"></p>
        <p><label for="prenom">Prenom :</label> <input type="text" id="prenom" name="prenom"></p>
        <p><label for="naissance">Date de naissance :</label> <input type="date" id="naissance" name="naissance"></p>
        <p><label for="email">Adresse mail :</label> <input type="email" id="email" name="email"></p>
        <p><label for="mdp">Mot de passe :</label> <input type="password" id="mdp" name="mdp"></p>
        <p><label for="permis">Numéro de permis :</label> <input type="text" id="permis" name="permis"></p>
        <p>
            <label for="anciennete">Nombre d'années d'ancienneté :</label>
            <input type="number" id="anciennete" name="anciennete" min="0" style="width: 60px;">
        </p>
        <p>
            <label for="ville">Ville</label>
            <select id="ville" name="ville">
                <option value="paris" selected>Paris</option>
                <option value="marseille">Marseille</option>
                <option value="lyon">Lyon</option>
                <option value="nice">Nice</option>
                <option value="montpellier">Montpellier</option>
            </select>
        </p>
        <p>
            <label for="adresse">Adresse du client :</label>
            <textarea id="adresse" name="adresse" rows="4" cols="30"></textarea>
        </p>

        <br>
        <p>Situation matrimoniale :</p>
        <p>
            <label for="marie">Marié</label>
            <input type="radio" id="marie" name="situation" value="marie">
            <label for="nonmarie">Non marié</label>
            <input type="radio" id="nonmarie" name="situation" value="non_marie">
        </p>

        <br>
        <p>Préference de voiture :</p>
        <p>
            <label for="auto">Automatique</label>
            <input type="checkbox" id="auto" name="voiture" value="automatique">
            <label for="manuelle">Manuelle</label>
            <input type="checkbox" id="manuelle" name="voiture" value="manuelle">
        </p>

        <p>
            <input type="submit" value="Enregistrer">
            <input type="reset" value="Annuler">
        </p>
    </form>

    <footer>
        <p>&copy; 2026 Agence Mediteranée - Localisation de vehicules</p>
    </footer>

</body>
</html>
